name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      # -D warnings keeps clippy findings from slipping in unnoticed.
      - name: Run clippy (warnings are errors)
        run: cargo clippy --all-targets --features server -- -D warnings

      - name: Compile all targets
        run: cargo check --all-targets --features server

      - name: USI protocol smoke test
        run: |
          cargo build --bin taikyokushogi-usi
          {
            printf 'usi\n'; sleep 2
            printf 'isready\n'; sleep 2
            printf 'position startpos\ngo depth 1\n'; sleep 20
            printf 'quit\n'
          } | ./target/debug/taikyokushogi-usi > usi_smoke.log
          grep -q '^id name TaikyokuShogi' usi_smoke.log
          grep -q '^usiok$' usi_smoke.log
          grep -q '^readyok$' usi_smoke.log
          grep -q '^bestmove ' usi_smoke.log

      - name: Run library unit tests
        run: cargo test --features server --lib

      - name: Run documentation tests
        run: cargo test --features server --doc

      - name: Run integration smoke tests
        run: cargo test --test smoke

      - name: Run HTTP API integration tests
        run: cargo test --features server --test server_api

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.85 (the declared rust-version)
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      # Compile-only: prove the declared minimum supported Rust version is
      # still sufficient for every target (no lint, no tests).
      - name: Check all targets on the MSRV
        run: cargo check --all-targets --features server

  pyo3:
    name: PyO3 bindings (build + import)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build the wheel (python feature)
        run: maturin build --release --features python

      - name: Import the module and check input validation
        run: |
          pip install target/wheels/taikyokushogi-*.whl
          python - <<'PY'
          import taikyokushogi as t

          assert t.BOARD_SIZE == 36
          board = t.PyBoard()
          cell = board.at(0, 0)
          assert cell is None or (isinstance(cell, tuple) and len(cell) == 2)
          # Invalid coordinates/colors must raise, never panic the interpreter.
          for bad_call in (
              lambda: board.at(36, 0),
              lambda: board.at(0, 36),
              lambda: board.moves_from_py(99, 99),
              lambda: board.piece_positions(7),
              lambda: board.royal_positions(2),
              lambda: board.apply_move_py(36, 0, 0, 0, False, None, False),
          ):
              try:
                  bad_call()
              except (IndexError, ValueError):
                  pass
              else:
                  raise SystemExit(f"{bad_call} must raise IndexError/ValueError")
          print("PyO3 smoke test OK")
          PY

  python-lint:
    name: Python lint (ruff) and types (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (CPU torch; needed for pyright)
        run: pip install -r training/requirements.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Install ruff and pyright
        run: pip install ruff pyright

      - name: Ruff (config in pyproject.toml)
        run: ruff check .

      - name: Pyright (basic mode, config in pyproject.toml)
        run: pyright

  build:
    name: Release build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binaries
        run: cargo build --release --bins --features server

  web-build:
    name: Web (Vite) production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: npm ci
        working-directory: ./web

      - name: Web unit tests (vitest)
        run: npm test
        working-directory: ./web

      - name: Vite production build
        run: npm run build
        working-directory: ./web

  nnue-python:
    name: NNUE Python pipeline and parity (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies (CPU torch)
        run: pip install numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Build the nnue tool
        run: cargo build --release --bin nnue

      - name: Python pipeline tests (includes the Rust/Python architecture hash check)
        run: NNUE_BIN=target/release/nnue python -m unittest training/test_pipeline.py -v

      - name: Parity gate on a random network (normal and thinned positions)
        run: |
          target/release/nnue random-net /tmp/ci.tkn --seed 3
          target/release/nnue dump-positions --net /tmp/ci.tkn --n 500 --seed 1 --out /tmp/p1.jsonl
          target/release/nnue dump-positions --net /tmp/ci.tkn --n 500 --seed 2 --thin --out /tmp/p2.jsonl
          python training/parity_gate.py --net /tmp/ci.tkn --positions /tmp/p1.jsonl
          python training/parity_gate.py --net /tmp/ci.tkn --positions /tmp/p2.jsonl
