name: Release

# Builds the engine for the three desktop platforms on native runners
# (macOS cannot be cross-compiled from Linux — it needs Apple's SDK, so it
# gets its own runner). Triggered by pushing a `v*` tag or manually
# ("Run workflow"); a GitHub Release with all archives is created on tags.
# Each platform ships three package variants: `-full` (web GUI included),
# `-engine` (binaries + docs only) and `-monolithic` (web GUI + a launcher
# running the server with --sessions, one isolated game per visitor).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64-gnu
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            packages: ''
          # Fully static Linux binary: no glibc version requirements,
          # runs on any distro (and old ones).
          - os: ubuntu-latest
            name: linux-x86_64-musl
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            packages: 'musl-tools'
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            archive: zip
            packages: ''
          # macOS arm64 and x86_64 are both built on the arm64 runner;
          # macOS cross-compiles between its own architectures for free.
          - os: macos-latest
            name: macos-aarch64
            target: aarch64-apple-darwin
            archive: tar.gz
            packages: ''
          - os: macos-latest
            name: macos-x86_64
            target: x86_64-apple-darwin
            archive: tar.gz
            packages: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ matrix.name }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binaries
        run: cargo build --release --bins --features server --target ${{ matrix.target }}

      - name: Stage files
        id: stage-files
        shell: bash
        run: |
          # Tag name (v0.1.0) on tag pushes; Cargo.toml version on manual runs.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="$GITHUB_REF_NAME"
          else
            VER="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          BASE="taikyokushogi-${VER}-${{ matrix.name }}"
          SRC="target/${{ matrix.target }}/release"

          # Three package variants per platform (see README "Prebuilt binaries"):
          #   full       — everything, web GUI included (shared-board server)
          #   engine     — binaries + docs, no web frontend
          #   monolithic — like full, and its launcher starts the server
          #                with --sessions: every visitor gets an isolated
          #                game state instead of one shared board.
          # Every variant ships the docs and license files.
          for variant in full engine monolithic; do
            STAGE="${BASE}-${variant}"
            mkdir "$STAGE"
            copied=0
            for bin in taikyokushogi-server taikyokushogi-cli taikyokushogi-usi nnue debug-cli selfplay; do
              for f in "$SRC/$bin" "$SRC/$bin.exe"; do
                if [ -f "$f" ]; then cp "$f" "$STAGE/"; copied=$((copied+1)); fi
              done
            done
            if [ "$copied" -lt 6 ]; then
              echo "ERROR: expected the 6 binaries in $SRC, only $copied copied" >&2
              ls "$SRC" >&2 || true
              exit 1
            fi
            cp README.md LICENSE PIECES.md "$STAGE/"
            cp -R docs "$STAGE/docs"
            cp -R LICENSES "$STAGE/LICENSES"
          done

          # full and monolithic additionally carry the prebuilt web frontend.
          for variant in full monolithic; do
            STAGE="${BASE}-${variant}"
            mkdir -p "$STAGE/web"
            cp -R web/dist "$STAGE/web/dist"
          done

          # monolithic: turnkey launcher isolating every visitor.
          cat > "${BASE}-monolithic/start-server-monolithic.sh" <<'EOF'
          #!/usr/bin/env bash
          # Monolithic package launcher: per-session game state (no shared
          # board) — every visitor gets an isolated game.
          exec "$(dirname "$0")/taikyokushogi-server" --sessions "$@"
          EOF
          chmod +x "${BASE}-monolithic/start-server-monolithic.sh"
          printf '%s\n' \
            '@echo off' \
            'rem Monolithic package launcher: per-session game state (no shared' \
            'rem board) - every visitor gets an isolated game.' \
            '"%~dp0taikyokushogi-server.exe" --sessions %*' \
            > "${BASE}-monolithic/start-server-monolithic.cmd"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          for variant in full engine monolithic; do
            tar -czf "${BASE}-${variant}.tar.gz" "${BASE}-${variant}"
          done

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          foreach ($variant in 'full', 'engine', 'monolithic') {
            Compress-Archive -Path "${env:BASE}-$variant" -DestinationPath "${env:BASE}-$variant.zip"
          }

      - name: Upload artifacts (tar.gz)
        if: matrix.archive == 'tar.gz'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.stage-files.outputs.base }}-*.tar.gz

      - name: Upload artifacts (zip)
        if: matrix.archive == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.stage-files.outputs.base }}-*.zip

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
