name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --features server

      - name: Compile all targets
        run: cargo check --all-targets --features server

      - name: Run library unit tests
        run: cargo test --features server --lib

      - name: Run documentation tests
        run: cargo test --features server --doc

      - name: Run integration smoke tests
        run: cargo test --test smoke

      - name: Run HTTP API integration tests
        run: cargo test --features server --test server_api

  build:
    name: Release build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binaries
        run: cargo build --release --bins --features server

  web-build:
    name: Web (Vite) production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: npm ci
        working-directory: ./web

      - name: Web unit tests (vitest)
        run: npm test
        working-directory: ./web

      - name: Vite production build
        run: npm run build
        working-directory: ./web
  nnue-python:
    name: NNUE Python pipeline and parity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (CPU torch)
        run: pip install numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Build the nnue tool
        run: cargo build --release --bin nnue

      - name: Python pipeline tests (includes the Rust/Python architecture hash check)
        run: NNUE_BIN=target/release/nnue python -m unittest training/test_pipeline.py -v

      - name: Parity gate on a random network (normal and thinned positions)
        run: |
          target/release/nnue random-net /tmp/ci.tkn --seed 3
          target/release/nnue dump-positions --net /tmp/ci.tkn --n 500 --seed 1 --out /tmp/p1.jsonl
          target/release/nnue dump-positions --net /tmp/ci.tkn --n 500 --seed 2 --thin --out /tmp/p2.jsonl
          python training/parity_gate.py --net /tmp/ci.tkn --positions /tmp/p1.jsonl
          python training/parity_gate.py --net /tmp/ci.tkn --positions /tmp/p2.jsonl
