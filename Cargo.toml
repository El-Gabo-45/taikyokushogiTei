[package]
name = "taikyokushogi"
version = "0.1.0"
edition = "2021"
description = "Taikyoku Shogi engine — the largest known shogi variant (36x36 board, 804 pieces, 209 initial piece types / 301 movement classes)"
license = "MIT"
repository = "https://github.com/El-Gabo-45/taikyokushogiTei"
readme = "README.md"
keywords = ["shogi", "taikyoku", "board-game", "chess-variant", "game-engine"]
categories = ["games", "game-engines"]
exclude = [
    "web/",
]

[lib]
name = "taikyokushogi"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "taikyokushogi-server"
path = "src/main.rs"

[[bin]]
name = "debug-cli"
path = "src/debug_cli.rs"

[[bin]]
name = "taikyokushogi-cli"
path = "src/cli.rs"

[features]
default = ["cpu"]
cpu = []
python = ["dep:pyo3"]
gpu-cuda = ["burn/cuda"]
gpu-metal = ["burn/metal"]
gpu-wgpu = ["burn/wgpu"]
gpu-vulkan = ["burn/wgpu", "wgpu/vulkan-portability"]
nnue = ["burn", "ndarray"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }
rand = "0.8"
burn = { version = "0.21", default-features = false, features = ["ndarray", "autodiff"], optional = true }
ndarray = { version = "0.16", optional = true }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
crossbeam = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
wgpu = { version = "22", features = ["vulkan-portability"], optional = true }

# NOTE: The previous list of hard deps (lz4, xxhash-rust, memmap2, bincode,
# bytemuck, dashmap, parking_lot, portable-atomic, rayon, half) had zero uses in src/,
# examples/ or training/ and was removed to slim the build.

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true

[[example]]
name = "play"

[[bin]]
name = "selfplay"
path = "src/selfplay_main.rs"
