[package]
name = "taikyokushogi"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Taikyoku Shogi engine — the largest known shogi variant (36x36 board, 804 pieces, 301 piece types: 209 initial + 92 promoted)"
license = "GPL-3.0-or-later"
repository = "https://github.com/El-Gabo-45/taikyokushogiTei"
readme = "README.md"
keywords = ["shogi", "taikyoku", "board-game", "chess-variant", "game-engine"]
categories = ["games", "game-engines"]
exclude = [
    "web/",
]

[lib]
name = "taikyokushogi"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "taikyokushogi-server"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "nnue"
path = "src/nnue_main.rs"

[[bin]]
name = "debug-cli"
path = "src/debug_cli.rs"

[[bin]]
name = "taikyokushogi-cli"
path = "src/cli.rs"

[[bin]]
name = "taikyokushogi-usi"
path = "src/usi_main.rs"

[features]
default = ["cpu"]
cpu = []
server = ["axum", "tokio", "tower-http"]
python = ["dep:pyo3"]
gpu-cuda = ["burn/cuda"]
gpu-metal = ["burn/metal"]
gpu-wgpu = ["burn/wgpu"]
gpu-vulkan = ["burn/wgpu", "wgpu/vulkan-portability"]
nnue = ["burn", "ndarray"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }
rand = "0.8"
burn = { version = "0.21", default-features = false, features = ["ndarray", "autodiff"], optional = true }
ndarray = { version = "0.16", optional = true }
axum = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Optional zstd-compressed network files (.tkn.zst); TKN1 itself stays raw.
zstd = "0.14"
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.5", features = ["cors", "fs"], optional = true }
crossbeam = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
wgpu = { version = "22", features = ["vulkan-portability"], optional = true }

[dev-dependencies]
# Used by tests/server_api.rs to drive the axum router in-process (no TCP).
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# NOTE: The previous list of hard deps (lz4, xxhash-rust, memmap2, bincode,
# bytemuck, dashmap, parking_lot, portable-atomic, rayon, half) had zero uses in src/,
# examples/ or training/ and was removed to slim the build.

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true

[[example]]
name = "play"

[[bin]]
name = "selfplay"
path = "src/selfplay_main.rs"
